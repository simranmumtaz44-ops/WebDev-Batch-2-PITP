<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservation</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1 class="center">Book a Table</h1>

<form class="form" onsubmit="return bookTable()">
  <input id="name" placeholder="Name" required>
  <input id="phone" placeholder="Phone (11 digits)" required>
  <input type="date" required>
  <input type="time" required>
  <input id="guests" type="number" placeholder="Guests" required>
  <button class="btn">Reserve</button>
</form>

<p id="msg" class="center"></p>

<script src="script.js"></script>
</body>
</html>
